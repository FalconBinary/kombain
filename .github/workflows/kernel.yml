name: kernel

# Builds linux6.18-kombain (kernel/) in a Void container and publishes it as a release, so the
# GF63 installs it from there. A kernel takes hours, and every release is a variant
# kombain-bench will have rows for, so it runs only when the kernel itself changes: a push to
# a kernel* branch that touches the template or the build script, or by hand from main (GitHub
# dispatches only workflows that exist on the default branch). The build itself is
# kernel/build.sh, the same script that checks the config in a local container.

on:
  push:
    branches: ['kernel*']
    paths:
      - 'kernel/srcpkgs/**'
      - 'kernel/build.sh'
      - 'kernel/void-packages.commit'
      - '.github/workflows/kernel.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release kernel-<version>-kombain-r<revision> (off: artifacts only)"
        type: boolean
        default: true
      replace:
        description: "Replace that release if it already exists"
        type: boolean
        default: false

# One kernel at a time: two builds would publish the same tag.
concurrency:
  group: kernel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: What to build
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The release tag
        id: tag
        # Before the two-hour build, not after it: the same tag again means the template's
        # revision= was not bumped. A push then builds nothing (a fix to the script or the
        # workflow needs no new kernel; the run shows a warning), a dispatch is refused, unless
        # the form's "Replace" is on or "Publish" is off (nothing is published then).
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          REPLACE: ${{ inputs.replace }}
        run: |
          t=kernel/srcpkgs/linux6.18-kombain/template
          tag="kernel-$(sed -n 's/^version=//p' "$t")-kombain-r$(sed -n 's/^revision=//p' "$t")"
          build=yes
          # a push has no inputs: it publishes, and replaces nothing
          if [ "${PUBLISH:-true}" = true ] && [ "${REPLACE:-false}" != true ] &&
             gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::warning::release $tag exists, so this push builds nothing; a new kernel needs revision= bumped in $t"
              build=no
            else
              echo "::error::release $tag exists: bump revision= in $t, or run with replace"
              exit 1
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "$tag: build=$build"

  build:
    name: linux6.18-kombain for x86_64
    needs: check
    if: needs.check.outputs.build == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Room on the disk
        # A kernel with Void's config and debug info for BTF needs tens of GB while it builds.
        # The runner's preinstalled SDKs are never used here.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /usr/lib/google-cloud-sdk /usr/lib/jvm
          docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Build in a Void container
        # The buildroot image is a bootstrapped masterdir, and the container is xbps-src's chroot
        # (kernel/build.sh); the checkout and the build tree come in as volumes, so the results
        # stay on the runner when the container is gone.
        run: |
          mkdir -p "$RUNNER_TEMP/kbuild"
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/kbuild:/build" -w /build \
            -e BUILD=/build -e OUT=/build/out -e JOBS=4 -e KOMBAIN_COMMIT="$GITHUB_SHA" \
            ghcr.io/void-linux/void-buildroot-glibc:latest sh /work/kernel/build.sh pkg

      - name: What came out
        run: |
          cd "$RUNNER_TEMP/kbuild/out"
          ls -l
          {
            echo '## linux6.18-kombain'
            echo
            echo '```'
            cat BUILD
            echo '```'
            echo
            echo "The config against Void's:"
            echo
            echo '```'
            cat diffconfig-void-to-kombain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux6.18-kombain
          path: ${{ runner.temp }}/kbuild/out/
          if-no-files-found: ignore

      - name: Release
        # every push build publishes; a dispatch can keep its result as an artifact only
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace }}
        run: |
          # The build's files belong to root (the container wrote them); the notes go beside them.
          out=$RUNNER_TEMP/kbuild/out
          tag=$(cat "$out/TAG")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$REPLACE" = true ]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            else
              echo "::error::release $tag exists: bump revision= in kernel/srcpkgs/linux6.18-kombain/template, or run with replace"
              exit 1
            fi
          fi
          {
            echo "Linux $(sed -n 's/^kernel release: //p' "$out/BUILD") for kombain's GF63: Void's linux6.18 with sched_ext"
            echo "(\`CONFIG_SCHED_CLASS_EXT=y\`), full preemption as the build default (\`preempt=\` still"
            echo "selects at boot) and \`-kombain\` in its name. The stock Void kernel stays installed as the fallback."
            echo
            echo '```'
            cat "$out/BUILD"
            echo '```'
            echo
            echo "Install and check: [kernel/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/kernel/README.md)."
            echo "Not measured yet: a kombain-bench row for this kernel says more than this note can."
          } > "$RUNNER_TEMP/notes.md"
          cd "$out"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" \
            ./*.xbps config-* diffconfig-void-to-kombain.txt BUILD SHA256SUMS
